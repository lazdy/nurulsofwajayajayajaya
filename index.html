<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Daily Routine - MPI Ruang Murid</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:linear-gradient(160deg,#0d47a1,#1565c0 55%,#0288d1);color:#fff;overflow:hidden}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 28px;font-weight:700;font-size:24px;background:#ffd54f;color:#1a1a1a;box-shadow:0 4px 0 #b28704;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b28704}
button:disabled{background:#9e9e9e;color:#212121;box-shadow:none;cursor:not-allowed}
button.sec{background:#fff;color:#0d47a1;box-shadow:0 4px 0 #90a4ae}
.card{background:#fff;color:#102027;border-radius:22px;padding:24px 32px}
h1,h2,h3,p{margin:0}
/* cover */
#cover{background:#0d47a1;cursor:pointer}
#cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cover .hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:20px;font-weight:600;text-shadow:0 2px 6px #000;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
/* name */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:22px}
input{font:inherit;font-size:30px;padding:14px 20px;border-radius:14px;border:4px solid #ffd54f;width:520px;text-align:center;color:#102027}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:16px;padding:0 24px;background:rgba(0,0,0,.28)}
.top h2{flex:1;font-size:30px}
.top button{padding:8px 18px;font-size:22px}
.prog{width:300px}
.prog small{font-size:16px;font-weight:700}
.bar{height:14px;background:#ffffff40;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ffd54f;transition:width .4s}
.body{position:absolute;left:40px;right:40px;top:96px;bottom:96px;display:flex;flex-direction:column;justify-content:center}
.nav{position:absolute;left:40px;right:40px;bottom:16px;display:flex;justify-content:space-between}
/* menu */
.menu{display:grid;grid-template-columns:repeat(2,380px);gap:28px;justify-content:center;margin-top:10px}
.menu button{height:190px;font-size:34px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.menu b{font-size:64px}
/* content */
.big{font-size:28px;line-height:1.5}
.big b{color:#0d47a1}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.vc{background:#fff;color:#102027;border-radius:16px;padding:10px 4px;text-align:center;font-size:20px;font-weight:700;border:4px solid #fff}
.vc span{display:block;font-size:46px}
.vc.seen{border-color:#43a047}
.vc.sel{border-color:#ffd54f;background:#fff8e1}
.detail{margin-top:14px;min-height:130px;display:flex;align-items:center;gap:24px;font-size:26px}
.detail .e{font-size:84px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;width:100%}
.opt{background:#fff;color:#102027;box-shadow:0 4px 0 #90a4ae;font-size:26px;padding:16px}
.opt.ok{background:#43a047;color:#fff;box-shadow:none}
.opt.no{background:#c62828;color:#fff;box-shadow:none}
.q{text-align:center;display:flex;flex-direction:column;align-items:center}
.qn{font-size:20px;font-weight:700;color:#ffd54f}
.qe{font-size:80px}
.q h2{font-size:32px}
.fb{min-height:100px;margin-top:12px;font-size:22px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.fb .msg{background:#fff;color:#102027;border-radius:14px;padding:10px 20px;border-left:10px solid #43a047;text-align:left}
.fb .msg.bad{border-color:#c62828}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 60px}
.mt{background:#fff;color:#102027;box-shadow:0 4px 0 #90a4ae;font-size:24px;padding:12px}
.mt.sel{background:#ffd54f}
.mt.ok{background:#43a047;color:#fff;box-shadow:none}
.mt.no{background:#c62828;color:#fff}
.ordw{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:12px 0}
.ordw button{background:#fff;color:#102027;box-shadow:0 4px 0 #90a4ae;font-size:24px;min-width:270px}
.ordw button.ok{background:#43a047;color:#fff;box-shadow:none}
.slots{display:flex;gap:8px;justify-content:center;margin-top:6px}
.slots div{width:60px;height:60px;border-radius:12px;background:#ffffff30;display:flex;align-items:center;justify-content:center;font-size:34px;border:3px dashed #fff}
table{width:100%;border-collapse:collapse;font-size:26px;background:#fff;color:#102027;border-radius:16px;overflow:hidden}
td,th{padding:10px 18px;text-align:left}
th{background:#ffd54f;color:#1a1a1a}
tr:nth-child(even) td{background:#e3f2fd}
.dev{text-align:center}
.dev .ph{width:260px;height:260px;border-radius:50%;object-fit:cover;border:8px solid #ffd54f;background:#fff}
.score{font-size:90px;font-weight:800;color:#ffd54f}
#mute{position:absolute;top:10px;right:20px;z-index:5}
</style>
</head>
<body>
<div id="stage">

<!-- COVER -->
<div id="cover" class="scr on">
  <img id="coverImg" alt="">
  <div class="hint">Sentuh mana saja untuk masuk</div>
</div>

<!-- NAME -->
<div id="nameScr" class="scr">
  <div class="center">
    <div style="font-size:90px">👋</div>
    <h1 style="font-size:44px">Hello! Siapa namamu?</h1>
    <input id="nameIn" maxlength="20" placeholder="Tulis namamu" autocomplete="off">
    <p id="nameErr" style="color:#ffd54f;font-size:22px;min-height:28px"></p>
    <button id="nameGo">Mulai ▶</button>
  </div>
</div>

<!-- MENU -->
<div id="menuScr" class="scr">
  <div class="center" style="gap:8px">
    <h1 style="font-size:46px">My Daily Routine</h1>
    <p id="hello" style="font-size:26px"></p>
    <div class="menu">
      <button data-go="learn"><b>📖</b>Belajar</button>
      <button data-go="play"><b>✏️</b>Bermain</button>
      <button data-go="board"><b>🏆</b>Papan Peringkat</button>
      <button data-go="dev"><b>👩‍💻</b>Pengembang</button>
    </div>
  </div>
</div>

<!-- LEARN -->
<div id="learnScr" class="scr">
  <div class="top"><button class="sec" data-go="menu">🏠 Menu</button><h2>Belajar: My Daily Routine</h2>
    <div class="prog"><small id="pt"></small><div class="bar"><i id="pb"></i></div></div><span style="width:70px"></span></div>
  <div class="body" id="lbody"></div>
  <div class="nav"><button class="sec" id="lBack">◀ Kembali</button><button id="lNext">Lanjut ▶</button></div>
</div>

<!-- PLAY -->
<div id="playScr" class="scr">
  <div class="top"><button class="sec" data-go="menu">🏠 Menu</button><h2>Bermain: Latihan Soal</h2>
    <div class="prog"><small id="qt"></small><div class="bar"><i id="qb"></i></div></div><span style="width:70px"></span></div>
  <div class="body" id="pbody"></div>
</div>

<!-- BOARD -->
<div id="boardScr" class="scr">
  <div class="top"><button class="sec" data-go="menu">🏠 Menu</button><h2>🏆 Papan Peringkat</h2><span style="width:70px"></span></div>
  <div class="body" id="bbody"></div>
</div>

<!-- DEV -->
<div id="devScr" class="scr">
  <div class="top"><button class="sec" data-go="menu">🏠 Menu</button><h2>Pengembang</h2><span style="width:70px"></span></div>
  <div class="body dev" style="align-items:center">
    <img id="devImg" class="ph" alt="Foto pengembang">
    <h1 style="font-size:46px;margin-top:18px">Lady Diana</h1>
    <p style="font-size:26px;margin-top:6px">Pengembang MPI "My Daily Routine"</p>
  </div>
</div>

<button id="mute" title="Musik">🔊</button>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* ---------- scaling 16:9 ---------- */
var st=$('stage');
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform='scale('+s+')';st.style.marginLeft=(-640*s)+'px';st.style.marginTop=(-360*s)+'px'}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
function sh(a){return a.map(function(v){return[Math.random(),v]}).sort(function(x,y){return x[0]-y[0]}).map(function(v){return v[1]})}
function tryImg(img,base,exts){var i=0;img.onerror=function(){i++;if(i<exts.length)img.src='./assets/'+base+'.'+exts[i];else{img.onerror=null;img.style.display='none'}};img.src='./assets/'+base+'.'+exts[0]}
tryImg($('coverImg'),'cover',['png','jpg','jpeg']);
tryImg($('devImg'),'pengembang',['jpg','jpeg','png']);

var muted=false,bgm=null;
try{bgm=new Audio('./assets/musiklatar.mp3');bgm.loop=true;bgm.volume=.25}catch(e){}
function snd(n){if(muted)return;try{var a=new Audio('./assets/'+n+'.mp3');var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
$('mute').onclick=function(e){e.stopPropagation();muted=!muted;this.textContent=muted?'🔇':'🔊';try{if(muted)bgm.pause();else{var p=bgm.play();if(p&&p.catch)p.catch(function(){})}}catch(x){}};
function speak(t){try{if(muted||!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

var mem=[];
function lbGet(){try{return JSON.parse(localStorage.getItem('mpi_lb_daily')||'[]')}catch(e){return mem}}
function lbSet(a){mem=a;try{localStorage.setItem('mpi_lb_daily',JSON.stringify(a))}catch(e){}}

function show(id){var s=document.querySelectorAll('.scr');for(var i=0;i<s.length;i++)s[i].classList.remove('on');$(id+'Scr').classList.add('on')}
function go(w){
  if(w==='menu'){$('hello').textContent='Hi, '+name+'! Pilih menu di bawah ini.'}
  if(w==='learn'){cur=0;renderLearn()}
  if(w==='play'){startQuiz()}
  if(w==='board'){renderBoard()}
  show(w)
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-go]');if(t)go(t.getAttribute('data-go'))});

/* ---------- data ---------- */
var V=[
{e:'⏰',en:'wake up',id:'bangun tidur',t:'05.00'},
{e:'🪥',en:'brush my teeth',id:'menggosok gigi',t:'05.15',full:1},
{e:'🚿',en:'take a bath',id:'mandi',t:'05.30'},
{e:'🍳',en:'have breakfast',id:'sarapan',t:'06.00'},
{e:'🎒',en:'go to school',id:'pergi ke sekolah',t:'06.30'},
{e:'📚',en:'study',id:'belajar',t:'07.00'},
{e:'🍛',en:'have lunch',id:'makan siang',t:'12.00'},
{e:'🏠',en:'go home',id:'pulang ke rumah',t:'14.00'},
{e:'✏️',en:'do my homework',id:'mengerjakan PR',t:'16.00',full:1},
{e:'😴',en:'go to bed',id:'tidur',t:'20.00'}
];
V.forEach(function(v){v.ex='I '+(v.full?v.en.replace('my ','my '):v.en)+' at '+v.t+'.'});
function expl(v){return v.e+' "'+v.en+'" artinya "'+v.id+'". Contoh kalimat: <b>'+v.ex+'</b>'}
function opts3(i,k){var o=[V[i].en];sh(V.filter(function(_,j){return j!==i})).slice(0,k-1).forEach(function(v){o.push(v.en)});return sh(o)}

/* ---------- generic question sequence ---------- */
function seq(c,qs,o){
  var i=0,score=0;
  (function render(){
    var q=qs[i];
    c.innerHTML='<div class="q"><div class="qn">Soal '+(i+1)+' dari '+qs.length+'</div><div class="qe">'+(q.e||'')+'</div><h2>'+q.q+'</h2><div class="opts"></div><div class="fb"></div></div>';
    if(o.onStep)o.onStep(i,qs.length);
    var op=c.querySelector('.opts'),fb=c.querySelector('.fb'),ans=false,tries=0,btns=[];
    q.o.forEach(function(t){
      var b=document.createElement('button');b.className='opt';b.textContent=t;btns.push(b);
      b.onclick=function(){
        if(ans)return;tries++;
        var right=(t===q.a);
        if(right||!o.retry){
          ans=true;
          if(right){b.classList.add('ok');snd('benar');if(tries===1)score+=10}
          else{b.classList.add('no');snd('salah');btns.forEach(function(x){if(x.textContent===q.a)x.classList.add('ok')})}
          fb.innerHTML='<div class="msg'+(right?'':' bad')+'">'+(right?'✅ Benar! ':'❌ Belum tepat. Jawaban: <b>'+q.a+'</b>. ')+q.x+'</div>';
          var nb=document.createElement('button');nb.textContent=(i<qs.length-1)?'Soal berikutnya ▶':(o.last||'Selesai ✔');
          nb.onclick=function(){if(i<qs.length-1){i++;render()}else o.fin(score)};
          fb.appendChild(nb);
        }else{
          b.classList.add('no');b.disabled=true;snd('salah');
          fb.innerHTML='<div class="msg bad">❌ Belum tepat. Petunjuk: '+(q.h||'Coba pikirkan lagi.')+' Silakan coba lagi.</div>';
        }
      };
      op.appendChild(b);
    });
  })();
}

/* ---------- LEARN steps ---------- */
var cur=0,done=[],name='';
var steps=[
{r:function(c,ok){
  c.innerHTML='<div class="card big"><h1 style="font-size:40px;color:#0d47a1">⏰ My Daily Routine</h1><p style="margin-top:12px"><b>Daily routine</b> artinya <b>kegiatan sehari-hari</b>: hal-hal yang kita lakukan setiap hari, dari bangun tidur sampai tidur lagi.</p><p style="margin-top:12px">Untuk menyebut kegiatan, kita memakai pola:</p><p style="font-size:38px;text-align:center;margin:14px 0;background:#fff8e1;border-radius:14px;padding:10px"><b>I</b> + kegiatan + <b>at</b> + jam</p><p>Contoh: <b>I wake up at 05.00.</b> = Saya bangun tidur pukul 05.00.</p><p style="margin-top:12px;color:#455a64;font-size:22px">Tujuan: kamu memahami dan dapat menyebut kegiatan sehari-hari dalam bahasa Inggris.</p></div>';ok()}},
{r:function(c,ok){
  var seen={},n=0;
  c.innerHTML='<p style="font-size:24px;margin-bottom:10px">🔍 <b>Jelajahi:</b> sentuh setiap kartu untuk melihat arti dan contohnya. <span id="cnt" style="color:#ffd54f;font-weight:800">0/10</span></p><div class="grid" id="gr"></div><div class="card detail" id="dt"><span style="font-size:24px">Sentuh sebuah kartu ☝️</span></div>';
  var gr=c.querySelector('#gr');
  V.forEach(function(v,i){
    var d=document.createElement('div');d.className='vc';d.innerHTML='<span>'+v.e+'</span>'+v.en;
    d.onclick=function(){
      var all=gr.children;for(var k=0;k<all.length;k++)all[k].classList.remove('sel');
      d.classList.add('sel','seen');if(!seen[i]){seen[i]=1;n++}
      c.querySelector('#cnt').textContent=n+'/10';
      c.querySelector('#dt').innerHTML='<span class="e">'+v.e+'</span><div><div style="font-size:34px;font-weight:800;color:#0d47a1">'+v.en+'</div><div>Artinya: <b>'+v.id+'</b></div><div>Contoh: <i>'+v.ex+'</i></div></div><button style="margin-left:auto" id="sp">🔊 Dengar</button>';
      c.querySelector('#sp').onclick=function(){speak(v.ex)};
      snd('benar');
      if(n===10)ok();
    };
    gr.appendChild(d);
  });
}},
{r:function(c,ok){
  var idx=sh([0,3,4,6,9]).slice(0,4);
  var qs=idx.map(function(i){return{e:V[i].e,q:'What is he/she doing?',o:opts3(i,4),a:V[i].en,x:expl(V[i]),h:'Lihat gambarnya, lalu ingat arti kegiatan di kartu tadi.'}});
  seq(c,qs,{retry:1,last:'Selesai ✔',fin:function(){ok();c.innerHTML='<div class="card big" style="text-align:center"><div style="font-size:80px">🎉</div><p>Bagus! Kamu bisa mengenali kegiatan dari gambar.</p><p style="color:#455a64;font-size:22px;margin-top:8px">Tekan <b>Lanjut</b> untuk menjodohkan kata.</p></div>'}});
}},
{r:function(c,ok){
  var idx=[0,1,2,5,7],n=0,selEn=null;
  c.innerHTML='<p style="font-size:24px;margin-bottom:8px">🔗 <b>Jodohkan:</b> sentuh kegiatan bahasa Inggris, lalu sentuh artinya.</p><div class="cols" id="mc"></div><div class="fb" id="mf"></div>';
  var L=sh(idx),R=sh(idx),mc=c.querySelector('#mc'),mf=c.querySelector('#mf'),lb={},rb={};
  var l=document.createElement('div'),r=document.createElement('div');l.style.cssText=r.style.cssText='display:flex;flex-direction:column;gap:10px';
  L.forEach(function(i){var b=document.createElement('button');b.className='mt';b.textContent=V[i].e+' '+V[i].en;lb[i]=b;b.onclick=function(){if(b.classList.contains('ok'))return;for(var k in lb)lb[k].classList.remove('sel');b.classList.add('sel');selEn=i};l.appendChild(b)});
  R.forEach(function(i){var b=document.createElement('button');b.className='mt';b.textContent=V[i].id;rb[i]=b;
    b.onclick=function(){
      if(b.classList.contains('ok'))return;
      if(selEn===null){mf.innerHTML='<div class="msg bad">Pilih dulu kegiatan bahasa Inggris di kiri.</div>';return}
      if(selEn===i){lb[i].classList.remove('sel');lb[i].classList.add('ok');b.classList.add('ok');snd('benar');n++;selEn=null;
        mf.innerHTML='<div class="msg">✅ Benar! '+expl(V[i])+'</div>';
        if(n===5){ok();mf.innerHTML+='<div style="font-weight:800">🎉 Semua cocok! Tekan Lanjut.</div>'}}
      else{snd('salah');b.classList.add('no');setTimeout(function(){b.classList.remove('no')},500);
        mf.innerHTML='<div class="msg bad">❌ "'+V[selEn].en+'" bukan "'+V[i].id+'". Artinya <b>'+V[selEn].id+'</b>. Coba lagi!</div>'}
    };r.appendChild(b)});
  mc.appendChild(l);mc.appendChild(r);
}},
{r:function(c,ok){
  var seqI=[0,2,3,4,6,9],pos=0;
  c.innerHTML='<p style="font-size:24px;text-align:center">🔢 <b>Urutkan:</b> sentuh kegiatan sesuai urutan dari pagi sampai malam.</p><div class="ordw" id="ow"></div><div class="slots" id="sl"></div><div class="fb" id="of"></div>';
  var ow=c.querySelector('#ow'),sl=c.querySelector('#sl'),of=c.querySelector('#of');
  seqI.forEach(function(){sl.appendChild(document.createElement('div'))});
  sh(seqI).forEach(function(i){
    var b=document.createElement('button');b.textContent=V[i].e+' '+V[i].en;
    b.onclick=function(){
      if(b.classList.contains('ok'))return;
      if(seqI[pos]===i){b.classList.add('ok');snd('benar');sl.children[pos].textContent=V[i].e;pos++;
        of.innerHTML='<div class="msg">✅ Tepat! '+V[i].en+' pukul '+V[i].t+'. '+V[i].id+'.</div>';
        if(pos===seqI.length){ok();of.innerHTML+='<div style="font-weight:800">🎉 Urutan benar! Tekan Lanjut.</div>'}}
      else{snd('salah');of.innerHTML='<div class="msg bad">❌ Belum waktunya. Kegiatan <b>'+V[i].en+'</b> ('+V[i].t+') terjadi di waktu lain. Pikirkan: apa yang kamu lakukan lebih dulu?</div>'}
    };ow.appendChild(b);
  });
}},
{r:function(c,ok){
  var qs=[
  {q:'"Go to bed" means "bangun tidur".',o:['Benar','Salah'],a:'Salah',e:'😴',x:'"Go to bed" artinya <b>tidur</b>. Bangun tidur adalah "wake up".',h:'Ingat kartu 😴.'},
  {q:'"I take a bath at 05.30." means "Saya mandi pukul 05.30."',o:['Benar','Salah'],a:'Benar',e:'🚿',x:'<b>take a bath</b> = mandi, <b>at 05.30</b> = pukul 05.30.',h:'Bagian "take a bath" artinya apa?'},
  {q:'We say "I have lunch at 12.00" for sarapan.',o:['Benar','Salah'],a:'Salah',e:'🍛',x:'"Have lunch" artinya <b>makan siang</b>. Sarapan adalah "have breakfast".',h:'Lunch bukan breakfast.'}];
  seq(c,qs,{retry:1,fin:function(){ok();c.innerHTML='<div class="card big" style="text-align:center"><div style="font-size:80px">👏</div><p>Hebat! Kamu sudah memahami kegiatan sehari-hari.</p></div>'}});
}},
{r:function(c,ok){
  var rows=V.map(function(v){return'<tr><td>'+v.e+' '+v.en+'</td><td>'+v.id+'</td><td>'+v.t+'</td></tr>'}).join('');
  c.innerHTML='<h2 style="text-align:center;margin-bottom:6px;font-size:28px">📝 Ringkasan</h2><table style="font-size:20px"><tr><th>English</th><th>Indonesia</th><th>Jam</th></tr>'+rows+'</table><p style="text-align:center;margin-top:8px;font-size:22px">Sudah siap? Pilih <b>Bermain</b> di menu untuk latihan soal!</p>';ok()}}
];
function upd(){
  $('pt').textContent='Langkah '+(cur+1)+' / '+steps.length;
  $('pb').style.width=((cur+(done[cur]?1:0))/steps.length*100)+'%';
  $('lNext').disabled=!done[cur];
  $('lNext').textContent=cur===steps.length-1?'Selesai ✔':'Lanjut ▶';
}
function renderLearn(){
  var b=$('lbody');b.innerHTML='';
  steps[cur].r(b,function(){done[cur]=true;upd()});
  upd();
}
$('lBack').onclick=function(){if(cur===0)go('menu');else{cur--;renderLearn();if(done[cur]===undefined)done[cur]=true;upd()}};
$('lNext').onclick=function(){if(cur===steps.length-1)go('menu');else{cur++;renderLearn()}};
/* revisiting a finished step: re-render is already marked done */
var _r=renderLearn;renderLearn=function(){var was=done[cur];_r();if(was){done[cur]=true;upd()}};

/* ---------- PLAY (latihan soal) ---------- */
function startQuiz(){
  var qs=sh(V.map(function(v,i){return i})).map(function(i,k){
    var v=V[i];
    if(k%2===0)return{e:v.e,q:'What is he/she doing?',o:opts3(i,4),a:v.en,x:expl(v)};
    return{q:'Apa bahasa Inggris dari "'+v.id+'"?',o:opts3(i,4),a:v.en,x:expl(v)};
  });
  var b=$('pbody');
  seq(b,qs,{retry:0,last:'Lihat Hasil ✔',
    onStep:function(i,n){$('qt').textContent='Soal '+(i+1)+' / '+n;$('qb').style.width=(i/n*100)+'%'},
    fin:function(score){
      $('qb').style.width='100%';
      var a=lbGet();a.push({n:name,s:score,d:new Date().toLocaleDateString('id-ID')});
      a.sort(function(x,y){return y.s-x.s});a=a.slice(0,10);lbSet(a);
      var msg=score>=80?'Luar biasa! Kamu sudah sangat paham. 🌟':score>=60?'Bagus! Pelajari lagi bagian yang masih keliru. 👍':'Ayo belajar lagi di menu Belajar, kamu pasti bisa! 💪';
      b.innerHTML='<div class="card" style="text-align:center"><h2 style="font-size:32px;color:#0d47a1">Hasil '+name+'</h2><div class="score" style="color:#0d47a1">'+score+'</div><p style="font-size:26px;margin:8px 0 18px">'+msg+'</p><div style="display:flex;gap:14px;justify-content:center"><button id="again">🔁 Ulangi</button><button class="sec" style="border:3px solid #0d47a1" data-go="board">🏆 Peringkat</button><button class="sec" style="border:3px solid #0d47a1" data-go="learn">📖 Belajar</button></div></div>';
      $('again').onclick=startQuiz;
    }});
}

/* ---------- BOARD ---------- */
function renderBoard(){
  var a=lbGet(),b=$('bbody');
  if(!a.length){b.innerHTML='<div class="card big" style="text-align:center">Belum ada data. Kerjakan latihan di menu <b>Bermain</b> dulu ya!</div>';return}
  var medal=['🥇','🥈','🥉'];
  b.innerHTML='<table style="font-size:24px"><tr><th>#</th><th>Nama</th><th>Skor</th><th>Tanggal</th></tr>'+a.map(function(r,i){return'<tr><td>'+(medal[i]||(i+1))+'</td><td>'+String(r.n).replace(/[<>&]/g,'')+'</td><td><b>'+r.s+'</b></td><td>'+r.d+'</td></tr>'}).join('')+'</table>';
}

/* ---------- flow ---------- */
$('cover').onclick=function(){
  try{if(!muted){var p=bgm.play();if(p&&p.catch)p.catch(function(){})}}catch(e){}
  show('name');setTimeout(function(){$('nameIn').focus()},100);
};
function enter(){
  var v=$('nameIn').value.replace(/[<>&"]/g,'').trim();
  if(!v){$('nameErr').textContent='Tulis namamu dulu ya 🙂';return}
  name=v;go('menu');
}
$('nameGo').onclick=enter;
$('nameIn').onkeydown=function(e){if(e.key==='Enter')enter()};
})();
</script>
